name: Collecte des appels d'offres

on:
  schedule:
    # Du lundi au vendredi à 6 h 17 (heure de Paris en hiver ; 7 h 17 en été)
    - cron: "17 5 * * 1-5"
  workflow_dispatch:
    inputs:
      recap:
        description: "Envoyer le récapitulatif par mail même si ce n'est pas lundi"
        type: boolean
        default: false

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collecte, notation et mise à jour de la mémoire
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECAP_EXPEDITEUR: ${{ vars.RECAP_EXPEDITEUR }}
          RECAP_DESTINATAIRES: ${{ vars.RECAP_DESTINATAIRES }}
        run: python -m veille.collect ${{ inputs.recap && '--recap' || '' }}
